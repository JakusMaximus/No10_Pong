<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No10 Po.ng</title>
  <style>
    body {
      background-color: #000;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .instructions {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }
    canvas {
      border: 4px solid #00ff66;
      background-color: #050f05;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      display: block;
      margin: 0 auto;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>NO10 PO.NG</h1>
  <div class="instructions">Use Up / Down Arrow keys to control your selected side</div>

  <canvas id="pongCanvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');

    // Game State Variables
    let gameStarted = false;
    let humanSide = 'london'; // default selection

    // Load local Burnham.png file directly from your repository
    const ballImage = new Image();
    ballImage.src = 'Burnham.png';
    let imageLoaded = false;
    ballImage.onload = () => { imageLoaded = true; };

    // Game Objects
    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 22,
      speed: 6,
      velocityX: 6,
      velocityY: 6
    };

    const playerLeft = {
      x: 30,
      y: canvas.height / 2 - 45,
      width: 14,
      height: 90,
      score: 0,
      speed: 4, // Easy AI speed
      label: "MANCHESTER"
    };

    const playerRight = {
      x: canvas.width - 44,
      y: canvas.height / 2 - 45,
      width: 14,
      height: 90,
      score: 0,
      speed: 8,
      label: "LONDON"
    };

    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    // Click listener for side selection menu
    canvas.addEventListener('click', (e) => {
      if (!gameStarted) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // Check Manchester Button (left box)
        if (mouseX >= 250 && mouseX <= 400 && mouseY >= 240 && mouseY <= 290) {
          humanSide = 'manchester';
          gameStarted = true;
        }
        // Check London Button (right box)
        if (mouseX >= 420 && mouseX <= 570 && mouseY >= 240 && mouseY <= 290) {
          humanSide = 'london';
          gameStarted = true;
        }
      }
    });

    function update() {
      if (!gameStarted) return;

      ball.x += ball.velocityX;
      ball.y += ball.velocityY;

      if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
        ball.velocityY = -ball.velocityY;
      }

      // Manchester Control (Left)
      if (humanSide === 'manchester') {
        if (keys['ArrowUp'] && playerLeft.y > 0) playerLeft.y -= playerRight.speed;
        if (keys['ArrowDown'] && playerLeft.y < canvas.height - playerLeft.height) playerLeft.y += playerRight.speed;
      } else {
        // AI for Manchester
        let aiCenter = playerLeft.y + playerLeft.height / 2;
        if (aiCenter < ball.y - 25) playerLeft.y += playerLeft.speed;
        else if (aiCenter > ball.y + 25) playerLeft.y -= playerLeft.speed;
        
        if (playerLeft.y < 0) playerLeft.y = 0;
        if (playerLeft.y > canvas.height - playerLeft.height) playerLeft.y = canvas.height - playerLeft.height;
      }

      // London Control (Right)
      if (humanSide === 'london') {
        if (keys['ArrowUp'] && playerRight.y > 0) playerRight.y -= playerRight.speed;
        if (keys['ArrowDown'] && playerRight.y < canvas.height - playerRight.height) playerRight.y += playerRight.speed;
      } else {
        // AI for London
        let aiCenter = playerRight.y + playerRight.height / 2;
        if (aiCenter < ball.y - 25) playerRight.y += playerLeft.speed;
        else if (aiCenter > ball.y + 25) playerRight.y -= playerLeft.speed;

        if (playerRight.y < 0) playerRight.y = 0;
        if (playerRight.y > canvas.height - playerRight.height) playerRight.y = canvas.height - playerRight.height;
      }

      const activePaddle = (ball.x < canvas.width / 2) ? playerLeft : playerRight;
      
      if (collision(ball, activePaddle)) {
        let collidePoint = ball.y - (activePaddle.y + activePaddle.height / 2);
        collidePoint = collidePoint / (activePaddle.height / 2);
        
        let angleRad = (Math.PI / 4) * collidePoint;
        let direction = (ball.x < canvas.width / 2) ? 1 : -1;

        ball.velocityX = direction * ball.speed * Math.cos(angleRad);
        ball.velocityY = ball.speed * Math.sin(angleRad);
        ball.speed += 0.5; // Quicker speed increase per hit
      }

      if (ball.x - ball.radius < 0) {
        playerRight.score++;
        resetBall();
      } else if (ball.x + ball.radius > canvas.width) {
        playerLeft.score++;
        resetBall();
      }
    }

    function collision(b, p) {
      b.top = b.y - b.radius;
      b.bottom = b.y + b.radius;
      b.left = b.x - b.radius;
      b.right = b.x + b.radius;

      p.top = p.y;
      p.bottom = p.y + p.height;
      p.left = p.x;
      p.right = p.x + p.width;

      return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
    }

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 6;
      ball.velocityX = -ball.velocityX;
    }

    function render() {
      ctx.fillStyle = '#050f05';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!gameStarted) {
        // Draw Start Menu Selection Screen
        ctx.fillStyle = '#00ff66';
        ctx.font = '28px "Courier New", Courier, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CHOOSE YOUR SIDE', canvas.width / 2, 150);

        // Manchester Button
        ctx.fillStyle = '#004411';
        ctx.fillRect(250, 240, 150, 50);
        ctx.strokeStyle = '#00ff66';
        ctx.strokeRect(250, 240, 150, 50);
        ctx.fillStyle = '#ffff00';
        ctx.font = '16px "Courier New", Courier, monospace';
        ctx.fillText('MANCHESTER', 325, 271);

        // London Button
        ctx.fillStyle = '#004411';
        ctx.fillRect(420, 240, 150, 50);
        ctx.strokeStyle = '#00ff66';
        ctx.strokeRect(420, 240, 150, 50);
        ctx.fillStyle = '#ffff00';
        ctx.fillText('LONDON', 495, 271);

        ctx.textAlign = 'left';
        return;
      }

      // Center net
      ctx.strokeStyle = '#004411';
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scores
      ctx.fillStyle = '#00ff66';
      ctx.font = '40px "Courier New", Courier, monospace';
      ctx.fillText(playerLeft.score, canvas.width / 4, 60);
      ctx.fillText(playerRight.score, (canvas.width / 4) * 3, 60);

      // White Paddles
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(playerLeft.x, playerLeft.y, playerLeft.width, playerLeft.height);
      ctx.fillRect(playerRight.x, playerRight.y, playerRight.width, playerRight.height);

      // Red, Non-bold Vertical Labels
      ctx.font = '12px "Courier New", Courier, monospace';
      ctx.fillStyle = '#ff0000';

      ctx.save();
      ctx.translate(playerLeft.x + playerLeft.width / 2, playerLeft.y + playerLeft.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.fillText(playerLeft.label, 0, 4);
      ctx.restore();

      ctx.save();
      ctx.translate(playerRight.x + playerRight.width / 2, playerRight.y + playerRight.height / 2);
      ctx.rotate(Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.fillText(playerRight.label, 0, 4);
      ctx.restore();

      // Ball Rendering with Burnham.png
      ctx.save();
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      if (imageLoaded) {
        ctx.drawImage(ballImage, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
      } else {
        ctx.fillStyle = '#00ff66';
        ctx.fill();
      }
      ctx.restore();

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#00ff66';
      ctx.stroke();
    }

    function gameLoop() {
      update();
      render();
    }

    setInterval(gameLoop, 1000 / 60);
  </script>

</body>
</html>
