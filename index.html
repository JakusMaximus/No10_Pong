<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Pong - London vs Manchester (Solo)</title>
  <style>
    body {
      background-color: #000;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .instructions {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }
    canvas {
      border: 4px solid #00ff66;
      background-color: #050f05;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h1>No10 Pong</h1>
  <div class="instructions">Manchester: AI Controlled &nbsp;|&nbsp; Player (London): Up / Down Arrow keys</div>

  <canvas id="pongCanvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');

    // Load local Burnham.png file directly from your repository
    const ballImage = new Image();
    ballImage.src = 'Burnham.png';
    let imageLoaded = false;
    ballImage.onload = () => { imageLoaded = true; };

    // Game Objects
    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 22,
      speed: 5,
      velocityX: 5,
      velocityY: 5
    };

    // Left Paddle is now Manchester (AI Controlled)
    const playerLeft = {
      x: 30,
      y: canvas.height / 2 - 45,
      width: 14,
      height: 90,
      score: 0,
      speed: 5.5, // AI Speed
      label: "MANCHESTER"
    };

    // Right Paddle is now London (Human Controlled via Arrow Keys)
    const playerRight = {
      x: canvas.width - 44,
      y: canvas.height / 2 - 45,
      width: 14,
      height: 90,
      score: 0,
      speed: 8, // Human Speed
      label: "LONDON"
    };

    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    function update() {
      ball.x += ball.velocityX;
      ball.y += ball.velocityY;

      if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
        ball.velocityY = -ball.velocityY;
      }

      // AI Controls for Manchester (Left Paddle) - tracks the ball automatically
      let aiCenter = playerLeft.y + playerLeft.height / 2;
      if (aiCenter < ball.y - 10) {
        playerLeft.y += playerLeft.speed;
      } else if (aiCenter > ball.y + 10) {
        playerLeft.y -= playerLeft.speed;
      }
      
      // Keep AI paddle within canvas bounds
      if (playerLeft.y < 0) playerLeft.y = 0;
      if (playerLeft.y > canvas.height - playerLeft.height) playerLeft.y = canvas.height - playerLeft.height;

      // Human Controls for London (Right Paddle - Arrow Up / Arrow Down)
      if (keys['ArrowUp'] && playerRight.y > 0) playerRight.y -= playerRight.speed;
      if (keys['ArrowDown'] && playerRight.y < canvas.height - playerRight.height) playerRight.y += playerRight.speed;

      const activePaddle = (ball.x < canvas.width / 2) ? playerLeft : playerRight;
      
      if (collision(ball, activePaddle)) {
        let collidePoint = ball.y - (activePaddle.y + activePaddle.height / 2);
        collidePoint = collidePoint / (activePaddle.height / 2);
        
        let angleRad = (Math.PI / 4) * collidePoint;
        let direction = (ball.x < canvas.width / 2) ? 1 : -1;

        ball.velocityX = direction * ball.speed * Math.cos(angleRad);
        ball.velocityY = ball.speed * Math.sin(angleRad);
        ball.speed += 0.2;
      }

      if (ball.x - ball.radius < 0) {
        playerRight.score++;
        resetBall();
      } else if (ball.x + ball.radius > canvas.width) {
        playerLeft.score++;
        resetBall();
      }
    }

    function collision(b, p) {
      b.top = b.y - b.radius;
      b.bottom = b.y + b.radius;
      b.left = b.x - b.radius;
      b.right = b.x + b.radius;

      p.top = p.y;
      p.bottom = p.y + p.height;
      p.left = p.x;
      p.right = p.x + p.width;

      return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
    }

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 5;
      ball.velocityX = -ball.velocityX;
    }

    function render() {
      ctx.fillStyle = '#050f05';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#004411';
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#00ff66';
      ctx.font = '40px "Courier New", Courier, monospace';
      ctx.fillText(playerLeft.score, canvas.width / 4, 60);
      ctx.fillText(playerRight.score, (canvas.width / 4) * 3, 60);

      ctx.fillStyle = '#00ff66';
      ctx.fillRect(playerLeft.x, playerLeft.y, playerLeft.width, playerLeft.height);
      ctx.fillRect(playerRight.x, playerRight.y, playerRight.width, playerRight.height);

      // Vertical Labels
      ctx.font = 'bold 12px "Courier New", Courier, monospace';
      ctx.fillStyle = '#ff0000';

      ctx.save();
      ctx.translate(playerLeft.x + playerLeft.width / 2, playerLeft.y + playerLeft.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.fillText(playerLeft.label, 0, 4);
      ctx.restore();

      ctx.save();
      ctx.translate(playerRight.x + playerRight.width / 2, playerRight.y + playerRight.height / 2);
      ctx.rotate(Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.fillText(playerRight.label, 0, 4);
      ctx.restore();

      // Ball Rendering with Burnham.png
      ctx.save();
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      if (imageLoaded) {
        ctx.drawImage(ballImage, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
      } else {
        ctx.fillStyle = '#00ff66';
        ctx.fill();
      }
      ctx.restore();

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#00ff66';
      ctx.stroke();
    }

    function gameLoop() {
      update();
      render();
    }

    setInterval(gameLoop, 1000 / 60);
  </script>

</body>
</html>
